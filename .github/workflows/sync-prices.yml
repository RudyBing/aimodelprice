# LiteLLM 价格自动同步 + AI 模型导入
# 每天 UTC 00:00 (北京时间 8:00) 自动运行
# 包含：价格同步 + AI 生成新模型 + 自动提交
# 参考：.github/workflows/README.md

name: Sync LiteLLM Prices

on:
  # 定时触发：每天 UTC 00:00 (北京时间 8:00)
  schedule:
    - cron: '0 0 * * *'
  
  # 手动触发
  workflow_dispatch:
    inputs:
      skip_commit:
        description: 'Skip commit and push (dry run)'
        required: false
        default: 'false'
        type: string

# 限制并发运行
concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Sync prices and build data
        run: npm run sync
      
      - name: Configure git
        if: inputs.skip_commit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Check for changes
        if: inputs.skip_commit != 'true'
        id: git-check
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true' && inputs.skip_commit != 'true'
        run: |
          git add data/models-prices.json data/models-generated.ts
          git commit -m "chore(data): auto-sync LiteLLM prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        run: |
          echo "## 同步完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 同步时间：$(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.git-check.outputs.has_changes }}" == "true" ]; then
            echo "- 数据变更：已提交并推送" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 数据变更：无变化" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.skip_commit }}" == "true" ]; then
            echo "- 模式：Dry run (未提交)" >> $GITHUB_STEP_SUMMARY
          fi

  ai-import:
    needs: sync
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate candidates
        run: npm run generate:candidates
      
      - name: AI generate descriptions
        run: npm run ai:generate
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      
      - name: Import candidates
        run: npm run import:candidates
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Check for changes
        id: ai-git-check
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push AI generated models
        if: steps.ai-git-check.outputs.has_changes == 'true'
        run: |
          # 先暂存当前更改（避免 pull 失败）
          echo "💾 暂存当前更改..."
          git stash push -m "Auto-generated models $(date -u '+%Y-%m-%d %H:%M UTC')"
          
          # 拉取远程变更（使用 merge 而不是 rebase，避免复杂冲突）
          echo "🔄 拉取远程变更..."
          git pull origin main --no-rebase || {
            echo "⚠️ Pull 失败，尝试恢复更改..."
            
            # 恢复暂存的更改
            git stash pop || true
            
            # 对于自动生成的文件，直接使用远程版本（避免冲突）
            git checkout origin/main -- data/models-generated.ts data/models-metadata.json 2>/dev/null || true
            
            # 重新运行构建脚本生成最新文件
            echo "🔧 重新生成模型数据..."
            npm run build:data
            
            # 添加所有文件
            git add data/models-metadata.json data/models-generated.ts
          }
          
          # 恢复暂存的更改（如果有）- 但不要用 stash pop，因为可能已经处理了
          echo "🔄 检查是否需要恢复暂存的更改..."
          git stash list | grep -q "Auto-generated models" && git stash drop || true
          
          # 添加文件并创建提交
          git add data/models-metadata.json data/models-generated.ts
          git commit -m "feat(models): auto-import AI generated models $(date -u '+%Y-%m-%d %H:%M UTC')" || {
            echo "⚠️ 提交失败（可能无变更），跳过"
            exit 0
          }
          
          # 推送到远程
          git push origin main
          echo "✅ 推送成功！"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        run: |
          echo "## AI 模型导入完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 生成时间：$(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.ai-git-check.outputs.has_changes }}" == "true" ]; then
            echo "- 新增模型：已提交并推送" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 新增模型：无新模型" >> $GITHUB_STEP_SUMMARY
          fi
